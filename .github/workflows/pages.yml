name: Publish product documentation

on:
  push:
    branches: [master]
    paths: ['docs/**', '.github/docs/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/**', '.github/docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/docs/package-lock.json
      - name: Install the pinned Markdown renderer
        run: npm ci --prefix .github/docs --ignore-scripts
      - name: Render Markdown and check published links
        run: node .github/docs/build.mjs docs _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish the exact checked documentation artifact
        id: deployment
        uses: actions/deploy-pages@v5
