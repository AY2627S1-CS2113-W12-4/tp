<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:628px;height:934px;background:#FFFFFF;" width="628px" height="934px" viewBox="0 0 628 934" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="7"><text x="190.669" y="23.132" fill="#000" font-size="14" textLength="240.434" font-weight="700" font-family="Arial">Event lifecycle and save boundaries</text></g><rect x="252.5" y="124.099" width="112.676" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="257.5" y="149.181" fill="#000" font-size="14" textLength="102.676" font-family="Arial">NOT_STARTED</text><rect x="211" y="259.099" width="69.883" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="216" y="284.181" fill="#000" font-size="14" textLength="59.883" font-family="Arial">WAITING</text><rect x="230.5" y="411.099" width="160.91" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="235.5" y="436.181" fill="#000" font-size="14" textLength="150.91" font-family="Arial">ACCEPTING_ANSWER</text><rect x="265" y="563.099" width="91.689" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="270" y="588.181" fill="#000" font-size="14" textLength="81.689" font-family="Arial">RESOLVING</text><rect x="262.5" y="698.099" width="97.124" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="267.5" y="723.181" fill="#000" font-size="14" textLength="87.124" font-family="Arial">COMPLETED</text><g class="start_entity" data-qualified-name=".start." id="ent0006" data-source-line="15"><ellipse cx="309" cy="53.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0014" data-source-line="22"><ellipse cx="311" cy="810.099" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="311" cy="810.099" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="25"><path d="M6,258.099 L6,300.296 A0,0 0 0 0 6,300.296 L176.42,300.296 A0,0 0 0 0 176.42,300.296 L176.42,283.099 L210.76,279.099 L176.42,275.099 L176.42,268.099 L166.42,258.099 L6,258.099 A0,0 0 0 0 6,258.099" style="stroke:#181818;stroke-width:0.5;" fill="#FAFAFA"/><path d="M166.42,258.099 L166.42,268.099 L176.42,268.099 L166.42,258.099" style="stroke:#181818;stroke-width:0.5;" fill="#FAFAFA"/><text x="12" y="276.23" fill="#000" font-size="14" textLength="126.075" font-family="Arial">Reaction delay only.</text><text x="12" y="292.329" fill="#000" font-size="14" textLength="149.42" font-family="Arial">Both input modes poll it.</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="29"><path d="M427,394.099 L427,427.099 L391.84,431.099 L427,435.099 L427,468.493 A0,0 0 0 0 427,468.493 L611.406,468.493 A0,0 0 0 0 611.406,468.493 L611.406,404.099 L601.406,394.099 L427,394.099 A0,0 0 0 0 427,394.099" style="stroke:#181818;stroke-width:0.5;" fill="#FAFAFA"/><path d="M601.406,394.099 L601.406,404.099 L611.406,404.099 L601.406,394.099" style="stroke:#181818;stroke-width:0.5;" fill="#FAFAFA"/><text x="433" y="412.23" fill="#000" font-size="14" textLength="160.289" font-family="Arial">Controller owns the clock.</text><text x="433" y="428.329" fill="#000" font-size="14" textLength="163.406" font-family="Arial">Overdue input is incorrect.</text><text x="433" y="444.428" fill="#000" font-size="14" textLength="157.192" font-family="Arial">Resume keeps this stage</text><text x="433" y="460.526" fill="#000" font-size="14" textLength="132.303" font-family="Arial">with a fresh deadline.</text></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="35"><path d="M392,562.099 L392,579.099 L357.12,583.099 L392,587.099 L392,604.296 A0,0 0 0 0 392,604.296 L613.771,604.296 A0,0 0 0 0 613.771,604.296 L613.771,572.099 L603.771,562.099 L392,562.099 A0,0 0 0 0 392,562.099" style="stroke:#181818;stroke-width:0.5;" fill="#FAFAFA"/><path d="M603.771,562.099 L603.771,572.099 L613.771,572.099 L603.771,562.099" style="stroke:#181818;stroke-width:0.5;" fill="#FAFAFA"/><text x="398" y="580.23" fill="#000" font-size="14" textLength="200.771" font-family="Arial">Effects cannot be saved midway</text><text x="398" y="596.329" fill="#000" font-size="14" textLength="150.158" font-family="Arial">or reward twice on retry.</text></g><!--link *start* to NOT_STARTED--><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" id="lnk7" data-source-line="15" data-link-type="dependency"><path d="M309,63.289 C309,77.499 309,100.119 309,118.839" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-NOT_STARTED"/><polygon points="309,123.839,313,114.839,309,118.839,305,114.839,309,123.839" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link NOT_STARTED to WAITING--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="16" data-link-type="dependency"><path d="M269.62,164.259 C258.29,171.879 247.3,181.799 241,194.099 C230.61,214.389 233.436,236.312 238.246,254.122" style="stroke:#181818;stroke-width:1;" fill="none" id="NOT_STARTED-to-WAITING"/><polygon points="239.55,258.949,241.065,249.217,238.246,254.122,233.342,251.303,239.55,258.949" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="242" y="208.23" fill="#000" font-size="14" textLength="105.048" font-family="Arial">prepareEvent(...)</text><text x="265.731" y="224.329" fill="#000" font-size="14" textLength="57.586" font-family="Arial">[reaction]</text></g><!--link NOT_