<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="665" viewBox="0 0 1020 665" role="img" aria-labelledby="title desc"><title id="title">Evaluate one typing attempt</title><desc id="desc">GamePlayState calls the static evaluator, which validates and normalizes text, gets character accuracy, computes speed and diagnostics and returns an immutable result.</desc><defs><marker id="filled" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#222"/></marker><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.3"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717} .title{font-size:22px;font-weight:700} .head{font-size:17px;font-weight:600} .body{font-size:16px} .code{font-family:Consolas,monospace;font-size:14px} .small{font-size:14px} .line{fill:none;stroke:#222;stroke-width:1.5} .life{fill:none;stroke:#555;stroke-width:1.3;stroke-dasharray:6 5} .return{fill:none;stroke:#222;stroke-width:1.5;stroke-dasharray:6 4} .box{fill:white;stroke:#222;stroke-width:1.5}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="32" class="title" text-anchor="start">Evaluate one typing attempt</text><rect x="25" y="68" width="250" height="44" fill="#f0f0f0" stroke="#222" stroke-width="1.5"/><text x="150" y="96" class="head" text-anchor="middle">game:GamePlayState</text><rect x="395" y="68" width="220" height="44" fill="#f0f0f0" stroke="#222" stroke-width="1.5"/><text x="505" y="96" class="head" text-anchor="middle">TypingEvaluator</text><rect x="725" y="68" width="270" height="44" fill="#f0f0f0" stroke="#222" stroke-width="1.5"/><text x="860" y="96" class="head" text-anchor="middle">AccuracyCalculator</text><line x1="150" y1="112" x2="150" y2="575" class="life"/><line x1="505" y1="112" x2="505" y2="575" class="life"/><line x1="860" y1="112" x2="860" y2="575" class="life"/><rect x="394" y="130" width="600" height="42" fill="#fafafa" stroke="#222" stroke-width="1.5"/><text x="407" y="153" class="body" text-anchor="start">Evaluator and calculator operations are static.</text><rect x="497" y="200" width="16" height="350" fill="white" stroke="#222" stroke-width="1.5"/><rect x="852" y="310" width="16" height="100" fill="white" stroke="#222" stroke-width="1.5"/><line x1="150" y1="200" x2="497" y2="200" class="line" marker-end="url(#filled)"/><text x="323.5" y="190" class="code" text-anchor="middle">evaluateTyping(...)</text><rect x="505" y="267" width="16" height="20" fill="white" stroke="#222" stroke-width="1.5"/><rect x="860" y="377" width="16" height="20" fill="white" stroke="#222" stroke-width="1.5"/><rect x="505" y="477" width="16" height="20" fill="white" stroke="#222" stroke-width="1.5"/><rect x="505" y="532" width="16" height="12" fill="white" stroke="#222" stroke-width="1.5"/><path d="M513 245 H583 V267 H521" class="line" marker-end="url(#filled)"/><text x="600" y="250" class="code" text-anchor="start">validate and normalize</text><line x1="513" y1="310" x2="852" y2="310" class="line" marker-end="url(#filled)"/><text x="682.5" y="300" class="code" text-anchor="middle">calculate(expected, typed)</text><path d="M868 355 H956 V377 H876" class="line" marker-end="url(#filled)"/><text x="878" y="344" class="code" text-anchor="start">editDistance(...)</text><line x1="852" y1="410" x2="513" y2="410" class="return" marker-end="url(#open)"/><text x="682.5" y="400" class="code" text-anchor="middle">accuracyPercent</text><path d="M513 455 H583 V477 H521" class="line" marker-end="url(#filled)"/><text x="600" y="460" class="code" text-anchor="start">gross WPM + word diagnostics</text><path d="M513 510 H583 V532 H521" class="line" marker-end="url(#filled)"/><text x="600" y="515" class="code" text-anchor="start">create immutable TypingResult</text><line x1="497" y1="550" x2="150" y2="550" class="return" marker-end="url(#open)"/><text x="323.5" y="540" class="code" text-anchor="middle">TypingResult</text><rect x="174" y="595" width="820" height="53" fill="#fafafa" stroke="#222" stroke-width="1.5"/><text x="187" y="618" class="body" text-anchor="start">The state formats the result and submits it to the encounter.</text><text x="187" y="640" class="body" text-anchor="start">Deadline status is metadata; it does not reduce damage.</text></svg>