<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1120" viewBox="0 0 1100 1120" role="img" aria-labelledby="title desc">
<title id="title">Preserve the best attempt before rotating history</title>
<desc id="desc">GamePlayState saves an evaluated result through SaveStore. Missing high-score storage is initialized from existing history, the candidate updates the best only if higher, and only then is history trimmed to ten attempts. Storage errors are reported without preventing combat.</desc>
<defs><marker id="call" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#222"/></marker><marker id="reply" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#222" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717}.title{font-size:24px;font-weight:700}.head{font-size:18px;font-weight:600}.body{font-size:16px}.code{font-family:Consolas,monospace;font-size:16px}.small{font-size:15px}.line{fill:none;stroke:#222;stroke-width:1.5}.life{fill:none;stroke:#666;stroke-width:1.3;stroke-dasharray:6 5}.return{fill:none;stroke:#222;stroke-width:1.5;stroke-dasharray:6 4}</style>
<rect width="1100" height="1120" fill="white"/>
<text x="25" y="36" class="title" text-anchor="start">Preserve the best attempt before rotating history</text>
<rect x="25.0" y="68" width="270" height="46" fill="#f0f0f0" stroke="#222" stroke-width="1.5"/>
<text x="160" y="97" class="head" text-anchor="middle">game:GamePlayState</text>
<line x1="160" y1="114" x2="160" y2="980" class="life"/>
<rect x="350.0" y="68" width="240" height="46" fill="#f0f0f0" stroke="#222" stroke-width="1.5"/>
<text x="470" y="97" class="head" text-anchor="middle">history:SaveStore</text>
<line x1="470" y1="114" x2="470" y2="980" class="life"/>
<rect x="715.0" y="68" width="290" height="46" fill="#f0f0f0" stroke="#222" stroke-width="1.5"/>
<text x="860" y="97" class="head" text-anchor="middle">best:LeaderboardStore</text>
<line x1="860" y1="114" x2="860" y2="980" class="life"/>
<rect x="152" y="150" width="16" height="830" fill="white" stroke="#222" stroke-width="1.5"/>
<rect x="462" y="150" width="16" height="805" fill="white" stroke="#222" stroke-width="1.5"/>
<rect x="470" y="223" width="16" height="410" fill="white" stroke="#222" stroke-width="1.5"/>
<rect x="852" y="266" width="16" height="39" fill="white" stroke="#222" stroke-width="1.5"/>
<rect x="478" y="393" width="16" height="38" fill="white" stroke="#222" stroke-width="1.5"/>
<rect x="852" y="508" width="16" height="28" fill="white" stroke="#222" stroke-width="1.5"/>
<rect x="852" y="680" width="16" height="120" fill="white" stroke="#222" stroke-width="1.5"/>
<rect x="470" y="863" width="16" height="16" fill="white" stroke="#222" stroke-width="1.5"/>
<rect x="470" y="918" width="16" height="19" fill="white" stroke="#222" stroke-width="1.5"/>
<line x1="168" y1="155" x2="462" y2="155" class="line" marker-end="url(#call)"/>
<text x="315.0" y="145" class="code" text-anchor="middle">save(result)</text>
<path d="M478 200 H548 V223 H486" class="line" marker-end="url(#call)"/>
<text x="568" y="205" class="code" text-anchor="start">loadHighScore()</text>
<line x1="486" y1="266" x2="852" y2="266" class="line" marker-end="url(#call)"/>
<text x="669.0" y="256" class="code" text-anchor="middle">load()</text>
<line x1="852" y1="305" x2="486" y2="305" class="return" marker-end="url(#reply)"/>
<text x="669.0" y="295" class="code" text-anchor="middle">Optional&lt;SavedRecord&gt;</text>
<rect x="396" y="332" width="650" height="239" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M396 360 H436 L449 347 V332" class="line"/>
<text x="406" y="352" class="small" text-anchor="start">opt</text>
<text x="520" y="352" class="small" text-anchor="start">[high-score file is missing]</text>
<path d="M486 370 H548 V393 H494" class="line" marker-end="url(#call)"/>
<text x="568" y="375" class="code" text-anchor="start">load()</text>
<text x="568" y="423" class="small" text-anchor="start">returns latest history records</text>
<rect x="410" y="449" width="620" height="106" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M410 477 H450 L463 464 V449" class="line"/>
<text x="420" y="469" class="small" text-anchor="start">opt</text>
<text x="520" y="469" class="small" text-anchor="start">[history contains at least one record]</text>
<line x1="486" y1="508" x2="852" y2="508" class="line" marker-end="url(#call)"/>
<text x="669.0" y="498" class="code" text-anchor="middle">saveIfHigher(existingBest)</text>
<line x1="852" y1="536" x2="486" y2="536" class="return" marker-end="url(#reply)"/>
<path d="M486 603 H548 V626 H478" class="return" marker-end="url(#reply)"/>
<text x="568" y="608" class="code" text-anchor="start">Optional&lt;SavedRecord&gt;</text>
<line x1="478" y1="680" x2="852" y2="680" class="line" marker-end="url(#call)"/>
<text x="665.0" y="670" class="code" text-anchor="middle">saveIfHigher(candidate)</text>
<rect x="552" y="701" width="510" height="87" fill="#f7f7f7" stroke="#222" stroke-width="1.5"/>
<text x="566" y="726" class="body" text-anchor="start">Reload and validate the current best.</text>
<text x="566" y="749" class="body" text-anchor="start">Write only if absent or beaten by WPM, then accuracy.</text>
<text x="566" y="772" class="body" text-anchor="start">Lower scores and exact ties leave the file unchanged.</text>
<line x1="852" y1="800" x2="478" y2="800" class="return" marker-end="url(#reply)"/>
<path d="M478 840 H548 V863 H486" class="line" marker-end="url(#call)"/>
<text x="568" y="845" class="code" text-anchor="start">read history; append candidate; retain latest ten</text>
<path d="M478 895 H548 V918 H486" class="line" marker-end="url(#call)"/>
<text x="568" y="900" class="code" text-anchor="start">writeSafely(...)</text>
<text x="568" y="925" class="small" text-anchor="start">Inherited from FileStore: temporary write, replace, cleanup.</text>
<line x1="462" y1="955" x2="168" y2="955" class="return" marker-end="url(#reply)"/>
<text x="315.0" y="945" class="code" text-anchor="middle">return</text>
<rect x="25" y="995" width="1050" height="110" fill="#f7f7f7" stroke="#222" stroke-width="1.5"/>
<text x="39" y="1020" class="body" text-anchor="start">Successful path shown. Initialization precedes history rotation.</text>
<text x="39" y="1043" class="body" text-anchor="start">The high-score and history writes are separate, not a transaction.</text>
<text x="39" y="1066" class="body" text-anchor="start">An IOException aborts save(); GamePlayState reports it and still calls</text>
<text x="39" y="1089" class="body" text-anchor="start">CombatEncounter.submitTypingResult(result). Run autosaving is omitted.</text>
</svg>
