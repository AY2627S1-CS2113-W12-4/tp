<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="835" viewBox="0 0 1170 835" role="img" aria-labelledby="title desc"><title id="title">Boss phase 1 victory starts phase 2</title><desc id="desc">After a lethal phase 1 attack, the encounter returns without retaliation. GamePlayState checks victory, increments boss phase, gets a fresh enemy and begins another encounter using the same player.</desc><defs><marker id="filled" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#222"/></marker><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.3"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717} .title{font-size:22px;font-weight:700} .head{font-size:17px;font-weight:600} .body{font-size:16px} .code{font-family:Consolas,monospace;font-size:14px} .small{font-size:14px} .line{fill:none;stroke:#222;stroke-width:1.5} .life{fill:none;stroke:#555;stroke-width:1.3;stroke-dasharray:6 5} .return{fill:none;stroke:#222;stroke-width:1.5;stroke-dasharray:6 4} .box{fill:white;stroke:#222;stroke-width:1.5}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="32" class="title" text-anchor="start">Boss phase 1 victory starts phase 2</text><rect x="20" y="65" width="230" height="44" fill="#f0f0f0" stroke="#222" stroke-width="1.5"/><text x="135" y="93" class="head" text-anchor="middle">game:GamePlayState</text><rect x="330" y="65" width="300" height="44" fill="#f0f0f0" stroke="#222" stroke-width="1.5"/><text x="480" y="93" class="head" text-anchor="middle">phase1:CombatEncounter</text><rect x="745" y="65" width="220" height="44" fill="#f0f0f0" stroke="#222" stroke-width="1.5"/><text x="855" y="93" class="head" text-anchor="middle">EnemyFactory</text><line x1="135" y1="109" x2="135" y2="720" class="life"/><line x1="480" y1="109" x2="480" y2="425" class="life"/><line x1="855" y1="109" x2="855" y2="565" class="life"/><rect x="127" y="140" width="16" height="560" fill="white" stroke="#222" stroke-width="1.5"/><rect x="143" y="440" width="16" height="260" fill="white" stroke="#222" stroke-width="1.5"/><rect x="472" y="140" width="16" height="100" fill="white" stroke="#222" stroke-width="1.5"/><rect x="472" y="290" width="16" height="30" fill="white" stroke="#222" stroke-width="1.5"/><rect x="472" y="365" width="16" height="35" fill="white" stroke="#222" stroke-width="1.5"/><rect x="847" y="500" width="16" height="40" fill="white" stroke="#222" stroke-width="1.5"/><line x1="143" y1="140" x2="472" y2="140" class="line" marker-end="url(#filled)"/><text x="307.5" y="130" class="code" text-anchor="middle">submitTypingResult(result)</text><rect x="535" y="158" width="595" height="67" fill="#fafafa" stroke="#222" stroke-width="1.5"/><text x="548" y="181" class="body" text-anchor="start">Resolve attack; enemy reaches 0 HP.</text><text x="548" y="203" class="body" text-anchor="start">Complete victory and return before retaliation.</text><line x1="472" y1="240" x2="143" y2="240" class="return" marker-end="url(#open)"/><line x1="143" y1="290" x2="472" y2="290" class="line" marker-end="url(#filled)"/><text x="307.5" y="280" class="code" text-anchor="middle">getIsCompleted()</text><line x1="472" y1="320" x2="143" y2="320" class="return" marker-end="url(#open)"/><text x="307.5" y="310" class="code" text-anchor="middle">true</text><line x1="143" y1="365" x2="472" y2="365" class="line" marker-end="url(#filled)"/><text x="307.5" y="355" class="code" text-anchor="middle">getEncounterOutcome()</text><line x1="472" y1="400" x2="143" y2="400" class="return" marker-end="url(#open)"/><text x="307.5" y="390" class="code" text-anchor="middle">victory outcome</text><path d="M159 440 H234 V462 H159" class="line" marker-end="url(#filled)"/><text x="255" y="445" class="code" text-anchor="start">advanceAfterVictory(); bossPhase = 2</text><line x1="159" y1="500" x2="847" y2="500" class="line" marker-end="url(#filled)"/><text x="503" y="490" class="code" text-anchor="middle">createBossPhase(2)</text><line x1="847" y1="540" x2="159" y2="540" class="return" marker-end="url(#open)"/><text x="503" y="530" class="code" text-anchor="middle">fresh enemy: 70 HP, attack 20</text><rect x="930" y="570" width="220" height="44" fill="#f0f0f0" stroke="#222" stroke-width="1.5"/><text x="1040" y="598" class="head" text-anchor="middle">phase2:CombatEncounter</text><line x1="1040" y1="614" x2="1040" y2="720" class="life"/><line x1="159" y1="592" x2="930" y2="592" class="line" marker-end="url(#filled)"/><text x="544.5" y="582" class="code" text-anchor="middle">new CombatEncounter(samePlayer, enemy, ...)</text><rect x="1032" y="650" width="16" height="35" fill="white" stroke="#222" stroke-width="1.5"/><line x1="159" y1="650" x2="1032" y2="650" class="line" marker-end="url(#filled)"/><text x="595.5" y="640" class="code" text-anchor="middle">begin()</text><line x1="1032" y1="685" x2="159" y2="685" class="return" marker-end="url(#open)"/><text x="595.5" y="675" class="code" text-anchor="middle">ready for player turn</text><rect x="70" y="747" width="1060" height="66" fill="#fafafa" stroke="#222" stroke-width="1.5"/><text x="83" y="770" class="body" text-anchor="start">Player HP carries unchanged. No healing, overflow damage or transition attack.</text><text x="83" y="792" class="body" text-anchor="start">Phase 2 starts at full HP; defeating phase 1 does not win the run.</text></svg>