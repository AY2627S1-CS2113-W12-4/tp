<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">References during an active run</title><desc id="desc">GamePlayState retains one player and current combat encounter, uses EnemyFactory to create opponents, and replaces the encounter at scenario or boss phase boundaries.</desc><defs><marker id="filled" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#222"/></marker><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.3"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717} .title{font-size:22px;font-weight:700} .head{font-size:17px;font-weight:600} .body{font-size:16px} .code{font-family:Consolas,monospace;font-size:14px} .small{font-size:14px} .line{fill:none;stroke:#222;stroke-width:1.5} .life{fill:none;stroke:#555;stroke-width:1.3;stroke-dasharray:6 5} .return{fill:none;stroke:#222;stroke-width:1.5;stroke-dasharray:6 4} .box{fill:white;stroke:#222;stroke-width:1.5}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="32" class="title" text-anchor="start">References during an active run</text><rect x="330" y="65" width="340" height="208" fill="white" stroke="#222" stroke-width="1.5"/><line x1="330" y1="107" x2="670" y2="107" class="line"/><line x1="330" y1="165" x2="670" y2="165" class="line"/><text x="500" y="93" class="head" text-anchor="middle">GamePlayState</text><text x="346" y="132" class="code" text-anchor="start">- scenarioIndex : int</text><text x="346" y="154" class="code" text-anchor="start">- bossPhase : int</text><text x="346" y="192" class="code" text-anchor="start">- startScenario()</text><text x="346" y="221" class="code" text-anchor="start">- startBossPhase()</text><text x="346" y="250" class="code" text-anchor="start">- advanceAfterVictory()</text><rect x="775" y="70" width="320" height="118" fill="white" stroke="#222" stroke-width="1.5"/><line x1="775" y1="110" x2="1095" y2="110" class="line"/><text x="935" y="98" class="head" text-anchor="middle">EnemyFactory</text><text x="789" y="139" class="code" text-anchor="start">+ createRandomEnemy(random, number)</text><text x="789" y="168" class="code" text-anchor="start">+ createBossPhase(phase)</text><line x1="789" y1="142" x2="1076" y2="142" class="line"/><line x1="789" y1="171" x2="989" y2="171" class="line"/><rect x="30" y="420" width="250" height="100" fill="white" stroke="#222" stroke-width="1.5"/><line x1="30" y1="462" x2="280" y2="462" class="line"/><text x="155" y="448" class="head" text-anchor="middle">Player</text><text x="45" y="495" class="code" text-anchor="start">+ getHealth() : int</text><rect x="390" y="420" width="320" height="150" fill="white" stroke="#222" stroke-width="1.5"/><line x1="390" y1="462" x2="710" y2="462" class="line"/><text x="550" y="448" class="head" text-anchor="middle">CombatEncounter</text><text x="405" y="490" class="code" text-anchor="start">+ begin()</text><text x="405" y="518" class="code" text-anchor="start">+ preparePlayerTurn(skill)</text><text x="405" y="546" class="code" text-anchor="start">+ submitTypingResult(result)</text><rect x="825" y="420" width="250" height="100" fill="white" stroke="#222" stroke-width="1.5"/><line x1="825" y1="462" x2="1075" y2="462" class="line"/><text x="950" y="448" class="head" text-anchor="middle">Enemy</text><text x="840" y="495" class="code" text-anchor="start">+ getHealth() : int</text><path d="M350 273 V345 H155 V420" class="line" marker-end="url(#open)"/><text x="190" y="335" class="body" text-anchor="start">player</text><text x="166" y="406" class="body" text-anchor="start">1</text><line x1="550" y1="273" x2="550" y2="420" class="line" marker-end="url(#open)"/><text x="565" y="352" class="body" text-anchor="start">encounter</text><text x="562" y="408" class="body" text-anchor="start">1</text><line x1="670" y1="140" x2="775" y2="140" class="return" marker-end="url(#open)"/><text x="722" y="128" class="body" text-anchor="middle">calls</text><line x1="390" y1="490" x2="280" y2="490" class="line" marker-end="url(#open)"/><text x="337" y="478" class="body" text-anchor="middle">player</text><text x="290" y="511" class="body" text-anchor="start">1</text><line x1="710" y1="490" x2="825" y2="490" class="line" marker-end="url(#open)"/><text x="767" y="478" class="body" text-anchor="middle">enemy</text><text x="804" y="511" class="body" text-anchor="start">1</text><line x1="935" y1="188" x2="935" y2="420" class="return" marker-end="url(#open)"/><text x="950" y="309" class="body" text-anchor="start">creates</text><rect x="25" y="135" width="266" height="95" fill="#fafafa" stroke="#222" stroke-width="1.5"/><text x="38" y="158" class="body" text-anchor="start">bossPhase = 0: regular</text><text x="38" y="180" class="body" text-anchor="start">bossPhase = 1 or 2: boss</text><text x="38" y="202" class="body" text-anchor="start">Same player carries all HP.</text><text x="25" y="614" class="body" text-anchor="start">Solid arrows: retained references. Dashed arrows: dependencies. Underlined operations: static.</text></svg>