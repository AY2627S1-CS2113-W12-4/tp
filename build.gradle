plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.jline:jline:3.30.6'
    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()
    enableAssertions = true

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainClass = 'seedu.keyboardwarrior.KeyboardWarrior'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'KeyboardWarrior.jar'
}

checkstyle {
    toolVersion = '14.1.0'
}

run {
    standardInput = System.in
    enableAssertions = true
}

// Compile through Gradle, then let the launch scripts start Java with native terminal input/output.
tasks.register('prepareTerminalRun') {
    group = 'application'
    description = 'Compiles the game and prepares a direct interactive terminal launch without a JAR.'
    dependsOn tasks.named('classes')

    def runtimeClasspath = sourceSets.main.runtimeClasspath
    def classpathFile = layout.buildDirectory.file('terminal-run/classpath.txt')
    def javaHomeFile = layout.buildDirectory.file('terminal-run/java-home.txt')
    inputs.files(runtimeClasspath)
    inputs.property('javaHome', System.getProperty('java.home'))
    inputs.property('javaVersion', JavaVersion.current().toString())
    outputs.files(classpathFile, javaHomeFile)

    doLast {
        if (JavaVersion.current() != JavaVersion.VERSION_25) {
            throw new GradleException('Use Java 25 to build and run Keyboard Warrior.')
        }
        def outputFile = classpathFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.setText(runtimeClasspath.asPath, 'UTF-8')
        javaHomeFile.get().asFile.setText(System.getProperty('java.home'), 'UTF-8')
    }
}
